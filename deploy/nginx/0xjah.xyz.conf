server {
    server_name 0xjah.xyz www.0xjah.xyz;

    location / {
        proxy_pass http://127.0.0.1:26062;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Branded page for errors nginx produces itself (app down, bad request).
    # No proxy_intercept_errors, so the app's own error pages pass through untouched.
    error_page 400 404 405 408 413 414 429 500 502 503 504 /__error.html;
    location = /__error.html {
        internal;
        root /usr/share/nginx/0xjah.xyz;
        ssi on;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/0xjah.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/0xjah.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

}
server {
    if ($host = www.0xjah.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = 0xjah.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name 0xjah.xyz www.0xjah.xyz;
    return 404; # managed by Certbot




}