; /etc/php/8.4/fpm/pool.d/limesurvey.conf (the stock www pool is disabled as www.conf.disabled)
[limesurvey]
user = limesurvey
group = limesurvey
listen = /run/php/limesurvey.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 120s
security.limit_extensions = .php
php_admin_value[open_basedir] = /srv/limesurvey:/var/lib/limesurvey:/tmp:/usr/share/php
php_admin_value[session.save_path] = /var/lib/limesurvey/sessions
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
php_admin_value[expose_php] = Off
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /var/lib/limesurvey/php-error.log
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
