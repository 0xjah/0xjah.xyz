<!DOCTYPE html>
<html lang="en" hx-boost="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | 0xjah.xyz</title>
  <meta name="description" content="A gallery of images 0xjah found cool.">

  <!-- Social preview -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://0xjah.xyz/gallery">
  <meta property="og:title" content="Gallery | 0xjah.xyz">
  <meta property="og:description" content="A gallery of images 0xjah found cool.">
  <meta property="og:image" content="https://0xjah.xyz/assets/images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Gallery | 0xjah.xyz">
  <meta name="twitter:description" content="A gallery of images 0xjah found cool.">
  <meta name="twitter:image" content="https://0xjah.xyz/assets/images/og-image.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">

  <!-- Fonts: preload so text renders in the right font on first paint -->
  <link rel="preload" href="/assets/fonts/iosevka-term-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/pixtura12.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Apply saved theme before paint (avoids a dark/light flash) -->
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>

  <!-- Gallery images come from R2: open that connection early -->
  <link rel="preconnect" href="https://pub-4b1a0460b57849199d5b56581139f4b7.r2.dev">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/assets/css/main.css" type="text/css">

  <!-- Scripts -->
  <script src="/assets/vendor/htmx-1.9.10.min.js" defer></script>
  <script src="/assets/js/main.js" defer></script>
</head>

<body>
  <div class="site-container">

    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="gallery-container">

      <!-- Header with Navigation -->
      <header class="site-header">
        <h1><a href="/">0xjah.xyz</a> <span class="page-title">/ gallery</span></h1>
        <nav class="top-nav">
          <a href="/">/me/</a>
          <a href="/blog">/log/</a>
          <a href="https://github.com/0xjah" target="_blank" rel="noopener noreferrer">/proj/</a>
          <a href="/misc">/msc/</a>
          <button id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
            <img src="/assets/icons/light-mode.svg" alt="Light mode" class="icon-sun">
            <img src="/assets/icons/dark-mode.svg" alt="Dark mode" class="icon-moon">
          </button>
        </nav>
      </header>

      <p>Images That I Found it Cool.</p>

      <!-- Gallery Content -->
      <div id="gallery-content" hx-get="/partials/gallery-grid.html" hx-trigger="load once" hx-swap="innerHTML">
        <!-- Skeleton shown until the grid arrives -->
        <div class="gallery-stats gallery-stats-skeleton">Loading gallery…</div>
        <div class="gallery-grid" aria-hidden="true">
          <div class="gallery-item" style="aspect-ratio: 3/4"></div>
          <div class="gallery-item" style="aspect-ratio: 1/1"></div>
          <div class="gallery-item" style="aspect-ratio: 4/5"></div>
          <div class="gallery-item" style="aspect-ratio: 3/4"></div>
          <div class="gallery-item" style="aspect-ratio: 1/1"></div>
          <div class="gallery-item" style="aspect-ratio: 4/3"></div>
          <div class="gallery-item" style="aspect-ratio: 3/4"></div>
          <div class="gallery-item" style="aspect-ratio: 4/5"></div>
        </div>
      </div>

    </main>

  </div>

  <!-- ===================== IMAGE MODAL ===================== -->
  <div id="imageModal" class="modal" onclick="closeModal()">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modalImage" alt="" onclick="event.stopPropagation()">
  </div>

</body>
</html>
