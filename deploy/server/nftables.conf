#!/usr/sbin/nft -f
# Own table only: `flush ruleset` would also wipe the rules Tailscale installs.
table inet host
delete table inet host
table inet nexus
delete table inet nexus

table inet host {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    iifname "tailscale0" accept
    udp dport 41641 accept
    # Public website (Caddy). Everything else, SSH included, is tailnet-only.
    tcp dport { 80, 443 } accept
    udp dport 443 accept
    # IPv6 stops working without neighbor discovery and packet-too-big.
    icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
    icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
}
