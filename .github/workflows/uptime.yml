name: uptime

# A failed run emails the repo owner. GitHub pauses schedules after 60 days without
# repo activity; re-enable it from the Actions tab if that happens.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: https://0xjah.xyz/health
        run: curl -fsS -m 15 --retry 3 --retry-delay 20 --retry-all-errors https://0xjah.xyz/health
